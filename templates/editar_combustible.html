{% extends "base.html" %}
{% block title %} — Editar combustible{% endblock %}
{% block content %}
<div class="container">
  <div style="display:flex;align-items:center;gap:12px;margin-bottom:20px">
    <a href="/usuario/vehiculo/{{ v.id }}" class="btn btn-sm"><i class="ti ti-arrow-left"></i></a>
    <h1 style="font-size:22px;font-weight:700">Editar carga de combustible</h1>
  </div>
  {% if error %}
  <div style="background:var(--redbg);color:var(--red);border:1px solid #F3C6C6;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:16px">{{ error }}</div>
  {% endif %}
  <div class="card">
    <form method="POST">
      <label>Fecha</label><input type="date" name="fecha" value="{{ c.fecha.strftime('%Y-%m-%d') }}">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div><label>Odómetro (km) *</label><input type="number" name="odometro" value="{{ c.odometro|int }}" required></div>
        <div><label>Litros *</label><input type="number" name="litros" value="{{ c.litros }}" step="0.001" required></div>
        <div><label>Costo total *</label><input type="number" name="costo" value="{{ c.costo or '' }}" step="0.01" required></div>
        <div><label>Precio/litro <span style="font-size:11px;color:var(--g);font-weight:600">AUTO</span></label>
          <input type="text" readonly style="background:#f6f6f4;color:#777" value="{% if c.precio_litro %}{{ '%.3f'|format(c.precio_litro) }}{% endif %}" placeholder="Se recalcula al guardar">
        </div>
      </div>
      <label>¿Tanque lleno?</label>
      <select name="tanque_lleno">
        <option value="1" {% if c.tanque_lleno %}selected{% endif %}>Sí — tanque lleno</option>
        <option value="0" {% if not c.tanque_lleno %}selected{% endif %}>No — carga parcial</option>
      </select>
      <label>Notas</label>
      <textarea name="notas" rows="2">{{ c.notas or '' }}</textarea>
      <p style="font-size:12px;color:#888;text-align:center;margin-bottom:8px">Verifique toda la información antes de guardar.</p>
      <button type="submit" class="btn btn-green" style="width:100%;justify-content:center"><i class="ti ti-device-floppy"></i> Guardar cambios</button>
    </form>
  </div>
</div>
{% endblock %}
